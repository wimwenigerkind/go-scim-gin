version: '3'

# Included taskfiles may not declare dotenv, so the whole repository reads the
# one at the root.
dotenv: ['.env']

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  vet:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  fmt:check:
    desc: Fail if a file is not gofmt-formatted
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi
    silent: true

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  check:
    desc: Check formatting, build, vet and test, as CI does
    cmds:
      - task: fmt:check
      - task: build
      - task: vet
      - task: test
